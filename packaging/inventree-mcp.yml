# InvenTree MCP packaged HTTP service configuration.
#
# Production HTTP startup validates protected MCP OAuth access-token
# envelopes, but live connector setup and packaged deployment remain gated
# follow-up work.
#
# This file may contain secrets (the InvenTree token, OAuth key material).
# Packaged installs create it with mode 0600; keep it owner-only. Configuration
# precedence is: defaults < this YAML file < environment variables < CLI
# flags. See docs/examples/inventree-mcp.yml for the full annotated field set.
#
# HTTP mode does not use a locally configured InvenTree auth scheme or a
# static InvenTree token: every request carries an MCP-issued OAuth bearer
# token, and the server recovers the caller's own InvenTree credential from
# its encrypted envelope per request. Setting either one here would have no
# effect, so both are intentionally omitted from this template. STDIO-only
# local-path upload staging is also intentionally omitted; HTTP mode accepts
# inline bytes or fetched URLs instead of local paths for uploads.

transport: http
listen: 127.0.0.1:28686
path: /mcp
environment: production
log_level: info

inventree_url: https://inventory.example.test
# Optional exact canonical frontend mount for returned object links. When
# omitted, the validated inventree_url site base gains the stock /web mount.
# inventree_web_url: https://inventory.example.test/web
# inventree_timeout: 30s
# inventree_tls_skip_verify: false

# Inline and URL-sourced upload size limit, and the maximum HTTP request body
# (tool arguments/results after base64 expansion) the listener accepts.
# upload_max_bytes: 5242880
# mcp_max_request_body_bytes: 8388608

# The JSON Lines debug traffic log captures full MCP request and response
# payloads, including sensitive URIs, request/response bodies, tool
# arguments, and any credentials or other sensitive data a client sends.
# Enable it only while diagnosing client behavior, never for routine
# production use. The file is created owner-only (0600); delete or rotate it
# promptly once diagnosis is complete, and keep its retention bounded.
# debug_traffic_log: /secure/path/mcp-traffic.jsonl

# Every bulk_update_*/bulk_set_stock_status tool's item-count limit and
# worker concurrency.
# bulk_max_items: 25
# bulk_concurrency: 4

# search_barcode_scan_history's internal upstream-page walk depth ceiling,
# used only when endpoint/from/to client-side filtering is requested.
# scan_history_max_page_depth: 50

# search_users' maximum offset-based page depth.
# user_search_max_page_depth: 50

# OpenTelemetry tracing is disabled by default. When enabled, use a trusted
# OTLP collector and protect any exporter headers as secrets.
# otel_enabled: false
# otel_service_name: inventree-mcp
# otel_exporter: otlpgrpc
# otel_endpoint: collector.example.test:4317
# otel_insecure: false
# otel_headers:
#   - authorization=Bearer REPLACE_WITH_COLLECTOR_CREDENTIAL
# otel_sample_ratio: 1.0
# otel_batch_timeout: 5s
# otel_export_timeout: 30s
# Prometheus metrics are disabled by default. Enable only when the packaged
# service listens on a trusted/private address; the scrape endpoint is not
# protected by MCP OAuth.
# otel_metrics_enabled: false
# otel_metrics_path: /metrics

# Generate 32-byte key material with a cryptographically secure generator such
# as `openssl rand -base64 32`. Keep exactly one active key. See the operator
# recipe for normal rotation, retirement, and compromise response.
# oauth_issuer_url: https://mcp.example.test
# oauth_resource_url: https://mcp.example.test/mcp
# oauth_keys:
#   - current:active:REPLACE_WITH_BASE64_32_BYTE_KEY
# oauth_client_ids:
#   - https://chatgpt.com/client-metadata/REPLACE_ME
# oauth_access_lifetime: 15m
# oauth_refresh_lifetime: 720h
# oauth_session_lifetime: 2160h
# Same-host reverse proxy example. Use only the narrow CIDRs of proxies that
# can connect to the configured listen address; do not copy private-network
# supernets.
# trusted_proxy_cidrs:
#   - 127.0.0.1/32
#   - ::1/128

# Stateless per-user bearer bootstrap lets a user exchange InvenTree Basic
# (username/password) or an existing InvenTree Token/Bearer credential for an
# opaque MCP bearer envelope, for clients that only support a static bearer
# token and cannot perform the MCP OAuth flow above. Disabled by default; OAuth
# and bootstrap may coexist. See the operator recipe for the request/response
# shape and lifecycle trade-offs.
# bootstrap_enabled: false
# bootstrap_envelope_lifetime: 720h

# Development-only HTTP smoke-test settings. Do not enable the packaged
# service for a live connector until setup and deployment validation are
# complete.
# environment: development
# dev_incomplete_oauth: true
