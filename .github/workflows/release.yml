name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GOFLAGS: -trimpath

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Validate release tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must match vX.X.X, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify README compatibility table is resolved
        run: |
          row=$(awk '/<!-- inventree-compat-table:current-row -->/{getline; print; exit}' README.md)
          if [ -z "$row" ]; then
            echo "::error::Could not locate the README compatibility table's current-row anchor" >&2
            exit 1
          fi
          if printf '%s' "$row" | grep -q 'unreleased'; then
            echo "::error::README compatibility table still shows an unreleased InvenTree pin ($row); replace the placeholder with this release's tag before tagging." >&2
            exit 1
          fi

      - name: Run tests
        run: go test -v -race ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
